name: Deploy Flutter Laboratory to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Version
        run: flutter --version

      - name: Prepare Deployment Directory
        run: |
          mkdir -p dist
          cp index.html dist/index.html

      - name: Build All 10 Flutter Web Experiments
        run: |
          EXPERIMENTS=("exp_01" "exp_02" "exp_03" "exp_04" "exp_05" "exp_06" "exp_07" "exp_08" "exp_09" "exp_10")
          for exp in "${EXPERIMENTS[@]}"; do
            echo "=========================================="
            echo "🚀 Building $exp for Web..."
            echo "=========================================="
            cd "$exp"
            flutter pub get
            flutter build web --release --base-href "./"
            mkdir -p "../dist/$exp"
            cp -r build/web/* "../dist/$exp/"
            cd ..
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch (Fallback)
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
